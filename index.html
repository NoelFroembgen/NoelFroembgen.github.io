<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partikel Herz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
const particleCount = 2500;

function heart(t){
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t)
           - 5 * Math.cos(2 * t)
           - 2 * Math.cos(3 * t)
           - Math.cos(4 * t)
    };
}

for(let i = 0; i < particleCount; i++){

    const t = Math.random() * Math.PI * 2;
    const p = heart(t);

    particles.push({

        tx: p.x * 18,
        ty: -p.y * 18,

        x: (Math.random() - 0.5) * window.innerWidth * 2,
        y: (Math.random() - 0.5) * window.innerHeight * 2,

        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.03 + 0.02
    });
}

function animate(){

    requestAnimationFrame(animate);

    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.08;

    for(const p of particles){

        p.x += (p.tx * pulse - p.x) * p.speed;
        p.y += (p.ty * pulse - p.y) * p.speed;

        const drawX = canvas.width/2 + p.x;
        const drawY = canvas.height/2 + p.y;

        ctx.beginPath();
        ctx.arc(drawX, drawY, p.size, 0, Math.PI*2);

        const glow =
            Math.floor(
                180 + Math.sin(Date.now()*0.003)*75
            );

        ctx.fillStyle =
            `rgb(255,${glow/3},${glow/3})`;

        ctx.fill();
    }
}

animate();
</script>

</body>
</html>
